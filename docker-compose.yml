services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "9094:9094"
    environment:
      # Single node running in KRaft mode: it is both broker and controller, no ZooKeeper.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is used by the other containers, EXTERNAL by apps running on your machine.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  ingestion-service:
    build:
      context: .
      args:
        MODULE: ingestion-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MBTA_API_KEY: ${MBTA_API_KEY:-}
      MBTA_ROUTES: ${MBTA_ROUTES:-1,15,22,23,28,39,57,66,111,116}
    depends_on:
      kafka:
        condition: service_healthy

  detector-service:
    build:
      context: .
      args:
        MODULE: detector-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DETECTOR_REPLAY_FROM_BEGINNING: ${DETECTOR_REPLAY_FROM_BEGINNING:-false}
    depends_on:
      kafka:
        condition: service_healthy

  alerts-api:
    build:
      context: .
      args:
        MODULE: alerts-api
    ports:
      - "8080:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
